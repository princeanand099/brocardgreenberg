name = "BrocardFormalization"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["BrocardFormalization"]

moreLeanArgs = ["-j1", "-M", "6144"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "BrocardFormalization"
